# Limitations ledger (root-owned; rendered into the README "Limitations" section). Updated at each stage gate.
- id: simulator-realism
  text: The counterparty and the user are simulated (a Claude Haiku Ear/Mouth around a deterministic policy, and a Claude Haiku user); human probes are few.
- id: heldout-mixture
  text: The held-out test is a mixture of a few never-piloted families; claims are family-mixture claims, not per-family ones.
- id: relay-dependency
  text: All hosted models go through one third-party relay whose behaviour can change without notice (ADR-0001).
- id: text-not-voice
  text: The counterparty lane is text with speech timing, not audio; voice is a later milestone.
- id: sim-approver
  text: In evaluation the deterministic sim approver decides from hidden constraints and ignores FastU's explanation.
- id: semantic-laundering
  text: Unauthorised speech by Fast (including paraphrased commitments) is measured, not blocked.
- id: capability-scope
  text: The cp-lane capability is a release token for authority-bearing lines, not complete mediation of everything Fast says.
- id: deviations
  text: Every deviation from the pre-registration is logged in docs/prereg.md.
