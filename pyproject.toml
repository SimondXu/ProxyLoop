[project]
name = "proxyloop"
version = "0.0.0"
description = "ProxyLoop v3: one traceable Fast/Slow agent execution path."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.13.5",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "hypothesis==6.168.1",
  "import-linter==2.15",
  "jinja2==3.1.6",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "ruff==0.16.9",
  "transformers==5.17.0",
]
sys = [
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  "transformers==5.17.0",
]
mod = [
  "httpx==0.28.1",
  "modal==1.5.5",
  "starlette==1.7.0",
]

[tool.uv]
default-groups = ["dev", "mod", "sys"]

# Every tool covers src, tests and scripts. scripts/spikes is root-run with
# dependencies outside this environment: ruff checks it, pyright skips it.
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "scripts"]
include = [
  "src/**/*.py",
  "tests/**/*.py",
  "scripts/**/*.py",
  "serving/**/*.py",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["serving", "scripts"]

[tool.pyright]
include = ["src", "tests", "scripts", "serving"]
exclude = [
  "scripts/spikes",
  # Runs only in its Modal image: imports torch, peft and vllm, never installed here.
  "scripts/mod/lora_ladder.py",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
