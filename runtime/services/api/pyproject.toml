[project]
name = "proxyloop-api"
version = "0.0.0"
description = "FastAPI control-plane service for ProxyLoop."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "proxyloop-agent-core==0.0.0",
  "proxyloop-provider-simulator==0.0.0",
  "proxyloop-telecom-domain==0.0.0",
]

[tool.uv.sources]
proxyloop-agent-core = { workspace = true }
proxyloop-provider-simulator = { workspace = true }
proxyloop-telecom-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxyloop_api"]
