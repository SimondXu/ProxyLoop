[project]
name = "proxyloop-workflow-worker"
version = "0.0.0"
description = "Temporal orchestration adapter for ProxyLoop Case commands."
requires-python = ">=3.12,<3.13"
dependencies = [
  "proxyloop-case-runtime==0.0.0",
  "pydantic>=2.11,<3",
  "temporalio>=1.32,<2",
]

[project.scripts]
proxyloop-workflow-worker = "proxyloop_workflow_worker.worker:main"

[tool.uv.sources]
proxyloop-case-runtime = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxyloop_workflow_worker"]
