[project]
name = "proxyloop-runtime"
version = "0.0.0"
description = "Runtime workspace for ProxyLoop domain contracts and services."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]

[tool.uv.workspace]
members = [
  "packages/agent_core",
  "packages/contracts",
  "packages/provider_simulator",
  "packages/telecom_domain",
  "services/api",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".."]
testpaths = [
  "packages/contracts/tests",
  "../tests/contract",
  "../tests/integration",
]
