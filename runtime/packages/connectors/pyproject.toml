[project]
name = "proxyloop-connectors"
version = "0.0.0"
description = "Transport-neutral local controlled channel adapters for ProxyLoop."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxyloop_connectors"]
