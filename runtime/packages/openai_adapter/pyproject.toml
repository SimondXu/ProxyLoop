[project]
name = "proxyloop-openai-adapter"
version = "0.0.0"
description = "Runtime-owned OpenAI-compatible Fast and Slow adapter."
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai==2.51.0",
  "proxyloop-agent-core==0.0.0",
  "proxyloop-contracts==0.0.0",
]

[tool.uv.sources]
proxyloop-agent-core = { workspace = true }
proxyloop-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxyloop_openai_adapter"]
