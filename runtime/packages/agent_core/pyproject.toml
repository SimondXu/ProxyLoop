[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "proxyloop-agent-core"
version = "0.0.0"
description = "Safe observation and deterministic consumer policy boundary for ProxyLoop."
requires-python = ">=3.12,<3.13"
dependencies = [
  "proxyloop-contracts==0.0.0",
]

[tool.uv.sources]
proxyloop-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/proxyloop_agent_core"]
