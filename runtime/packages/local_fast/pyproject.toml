[project]
name = "proxyloop-local-fast"
version = "0.0.0"
description = "Runtime HTTP client for the opt-in loopback local Fast gateway."
requires-python = ">=3.12,<3.13"
dependencies = [
  "proxyloop-agent-core==0.0.0",
  "proxyloop-contracts==0.0.0",
  "proxyloop-openai-adapter==0.0.0",
]

[tool.uv.sources]
proxyloop-agent-core = { workspace = true }
proxyloop-contracts = { workspace = true }
proxyloop-openai-adapter = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxyloop_local_fast"]
