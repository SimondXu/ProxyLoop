[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "proxyloop-provider-simulator"
version = "0.0.0"
description = "Deterministic fictional mobile Provider simulator for ProxyLoop."
requires-python = ">=3.12,<3.13"
dependencies = [
  "proxyloop-contracts==0.0.0",
  "proxyloop-telecom-domain==0.0.0",
]

[tool.uv.sources]
proxyloop-contracts = { workspace = true }
proxyloop-telecom-domain = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/proxyloop_provider_simulator"]
