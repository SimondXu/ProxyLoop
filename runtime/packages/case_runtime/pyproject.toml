[project]
name = "proxyloop-case-runtime"
version = "0.0.0"
description = "Transport-neutral Case application Runtime for ProxyLoop."
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "proxyloop-agent-core==0.0.0",
  "proxyloop-contracts==0.0.0",
  "proxyloop-provider-simulator==0.0.0",
  "proxyloop-telecom-domain==0.0.0",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
proxyloop-agent-core = { workspace = true }
proxyloop-contracts = { workspace = true }
proxyloop-provider-simulator = { workspace = true }
proxyloop-telecom-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxyloop_case_runtime"]
