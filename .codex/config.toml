model = "gpt-5.6-sol"
model_reasoning_effort = "high"
review_model = "gpt-5.6-terra"

[agents]
enabled = true
max_concurrent_threads_per_session = 6
interrupt_message = true

[agents.implementer]
description = "Use after Sol freezes interfaces and acceptance criteria to implement one owned ProxyLoop code slice with focused verification."
config_file = "agents/implementer.toml"

[agents.reviewer]
description = "Use after a material ProxyLoop diff stabilizes for independent defect-first review without editing or merging."
config_file = "agents/reviewer.toml"

[agents.fast-worker]
description = "Use for judgment-free mechanical ProxyLoop generation, formatting, fixtures, or repetitive edits with exact files and a named verification command."
config_file = "agents/fast-worker.toml"

[agents.explorer]
description = "Use for bounded cross-file mapping, lineage, test-impact, artifact, or noisy-log questions that should stay out of Sol's context."
config_file = "agents/explorer.toml"
