# S1-MOD-04: the Fast benchmark, Luna (C5) vs base Qwen (C2) vs fine-tuned Qwen
# (C1), EVAL §4.1 and §7. Every condition runs the same (family, instance, seed)
# cells (proxyloop.eval.benchmark). Families: piloted (train) or dev only before
# the unseal (I9, AGENTS rule 11); the loader refuses split "test". Adding a
# family is a data change here, never a code change.
# attested_adapter: a bundle counts only if its manifest's Fast model carries
# adapter shard hashes that match its attestation (C1: the trained LoRA slot).
id: fast-benchmark
conditions:
  - {name: C5}
  - {name: C2}
  - {name: C1, attested_adapter: true}
families:
  - family: cp-direct-discount  # EVAL §3 family 1: piloted -> train
    split: train
    instances: [cp-direct-discount-s0]
    seeds: [1, 2, 3, 4, 5]
salt: 20260926  # the interleaving salt (matrix.schedule)
# (a, b): a - b over the paired cells only; never on latency (user, 2026-09-26)
comparisons: [[C2, C5], [C1, C2], [C1, C5]]
